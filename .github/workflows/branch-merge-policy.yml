name: Branch Merge Policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Branch Policy
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        shell: bash
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"

          # ==========================================
          # UAT can NEVER be the source of a PR
          # ==========================================
          if [[ "$SOURCE" == "UAT" ]]; then
            echo "❌ BLOCKED"
            echo "UAT cannot be merged into any branch."
            exit 1
          fi

          # ==========================================
          # Otherwise allow the PR
          # ==========================================
          echo "✅ Branch policy passed."
          exit 0
